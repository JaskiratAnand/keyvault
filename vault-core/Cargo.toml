[package]
name = "vault-core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Zero-knowledge cryptographic core library for KeyVault"
repository = "https://github.com/JaskiratAnand/keyvault"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aes-gcm = "0.11.0"
argon2 = "0.5.3"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
rand = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
zeroize = { version = "1.9.0", features = ["derive"] }
wasm-bindgen = "0.2"
data-encoding = "2.8.0"
sha1 = "0.10.6"
hmac = "0.12.1"
