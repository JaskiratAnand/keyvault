name: Release Desktop App

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: get tag
        id: get_tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

  build-tauri:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
          - platform: 'windows-latest'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install pnpm
        uses: pnpm/action-setup@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Create WASM package stub for workspace install
        run: |
          mkdir -p vault-core/pkg
          echo '{"name":"vault-core","version":"0.1.0"}' > vault-core/pkg/package.json

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install desktop frontend dependencies
        run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_GDRIVE_DESKTOP_CLIENT_ID: ${{ secrets.VITE_GDRIVE_DESKTOP_CLIENT_ID }}
          VITE_GDRIVE_DESKTOP_CLIENT_SECRET: ${{ secrets.VITE_GDRIVE_DESKTOP_CLIENT_SECRET }}
        with:
          projectPath: './vault-desktop'
          tagName: ${{ github.ref_name }}
          releaseName: 'KeyVault Desktop ${{ github.ref_name }}'
          releaseBody: |
            KeyVault Desktop release ${{ github.ref_name }}.

            ### 📌 macOS Note ("KeyVault is damaged and can't be opened")
            If macOS blocks the app with `"KeyVault" is damaged and can't be opened`, run this command in Terminal after moving the app to Applications:
            ```bash
            xattr -cr /Applications/KeyVault.app
            ```
          releaseDraft: false
          prerelease: false
